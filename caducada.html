<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Persianas y Toldos Víctor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#820933">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/funnel-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/funnel-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Funnel Display'; src: url('assets/fonts/funnel-display.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: 'Funnel Sans'; src: url('assets/fonts/funnel-sans.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root {
    --granate: #820933; --granate-hondo: #45091C; --tinta: #2B1219; --oliva: #767522; --lima: #D4E79E; --papel: #F8FAF0;
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --alto: min(62svh, 560px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--papel); color: var(--tinta);
    font-family: 'Funnel Sans', 'Segoe UI', system-ui, sans-serif; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid var(--oliva); outline-offset: 3px; border-radius: 3px; }

  /* La persiana, en pequeño: bajada sobre la cabecera */
  .cab { position: relative; padding: clamp(16px, 3svh, 28px) var(--canal); color: var(--papel);
    background: repeating-linear-gradient(180deg, #A3164A 0, #8C0C3B 5px, #820933 12px, #6A0729 19px, #4A041B 22px); }
  .cab::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: linear-gradient(#45091C, #1E0410); }
  .cab p { font-family: 'Funnel Sans', sans-serif; font-weight: 600; font-size: clamp(.9rem, .8rem + .3vw, 1.05rem); color: var(--lima); line-height: 1.1; }
  .cab strong { display: block; font-family: 'Funnel Display', sans-serif; font-weight: 800; font-size: clamp(1.8rem, 1.2rem + 2.4vw, 3rem); color: var(--papel); line-height: 1.05; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(56px, 10svh, 104px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Funnel Display', sans-serif; font-weight: 700; color: var(--granate); font-size: clamp(1.75rem, 1.1rem + 2.4vw, 3.1rem); line-height: 1.12; text-wrap: balance; max-width: 19ch; }
  .mas { max-width: 34em; }
  .mas a { color: var(--granate); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; display: inline-block;
    background: linear-gradient(var(--lima), var(--lima)) 0 100% / 100% 4px no-repeat; transition: background-size .45s var(--sale); }
  .mas a:hover, .mas a:focus-visible { background-size: 100% 100%; }
  .mas a:active { color: var(--granate-hondo); }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; border-radius: 6px; background: #fff;
    box-shadow: 0 0 0 1px rgba(69, 9, 28, .14), 0 30px 60px -28px rgba(69, 9, 28, .55); position: relative; }
  .ventana::after { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(130, 9, 51, .35); border-radius: 3px; pointer-events: none; }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(2) { animation-delay: .1s; }
    .ventana { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 56s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <p>Persianas y Toldos <strong>Víctor</strong></p>
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Persianas%20y%20Toldos%20V%C3%ADctor">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home completa">
        <img src="assets/img/home-miniatura.webp" width="480" height="3600" alt="Miniatura de la home propuesta para Persianas y Toldos Víctor, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
